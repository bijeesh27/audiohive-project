services:
  redis:
    image: redis:7-alpine
    container_name: audiohive-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - audiohive-dev-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: audiohive-backend-dev
    command: npm run dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=development
    depends_on:
      - redis
    networks:
      - audiohive-dev-network

networks:
  audiohive-dev-network:
    driver: bridge

volumes:
  redis_data_dev:
    driver: local
